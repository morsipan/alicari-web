<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <style>
    @keyframes glowBreath {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes signalFlow {
      from { stroke-dashoffset: 36; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes moduleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    .glow-halo { animation: glowBreath 3.8s ease-in-out infinite; }
    .crimson-rays { animation: rayPulse 2.8s ease-in-out infinite; }
    .connector-signal { stroke-dasharray: 10 8; animation: signalFlow 1.6s linear infinite; }
    .node-pulse { animation: nodeBlink 2.2s ease-in-out infinite; }
    .module-a { animation: moduleFloat 4.6s ease-in-out infinite; }
    .module-b { animation: moduleFloat 4.6s ease-in-out 0.8s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .glow-halo, .crimson-rays, .connector-signal, .node-pulse, .module-a, .module-b {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>
  <defs>
    <radialGradient id="redGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CC0000" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#CC0000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#CC0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="#F6F6F6"/>
  <!-- Soft radial illumination behind bulb -->
  <circle class="glow-halo" cx="600" cy="185" r="165" fill="url(#redGlow2)"/>
  <!-- Crimson rays radiating from the bulb -->
  <g class="crimson-rays" stroke="#CC0000" stroke-width="2.4" stroke-linecap="round">
    <line x1="600" y1="68" x2="600" y2="92"/>
    <line x1="538" y1="84" x2="550" y2="105"/>
    <line x1="662" y1="84" x2="650" y2="105"/>
    <line x1="494" y1="126" x2="515" y2="139"/>
    <line x1="706" y1="126" x2="685" y2="139"/>
    <line x1="480" y1="185" x2="504" y2="185"/>
    <line x1="720" y1="185" x2="696" y2="185"/>
    <line x1="496" y1="242" x2="517" y2="230"/>
    <line x1="704" y1="242" x2="683" y2="230"/>
  </g>
  <!-- Clean lit bulb -->
  <g stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
    <path d="M600 112 C558 112 528 144 528 184 C528 212 544 232 557 250 C564 260 568 269 569 280 L631 280 C632 269 636 260 643 250 C656 232 672 212 672 184 C672 144 642 112 600 112 Z"/>
  </g>
  <g stroke="#CC0000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M585 280 L585 224 L575 194"/>
    <path d="M615 280 L615 224 L625 194"/>
    <path d="M575 194 Q583 182 591 194 Q600 206 609 194 Q617 182 625 194"/>
  </g>
  <g stroke="#1C1C1C" stroke-width="2" fill="#EAEAEA">
    <rect x="569" y="280" width="62" height="11" rx="3"/>
    <rect x="572" y="291" width="56" height="11" rx="3"/>
    <path d="M582 302 L618 302 L610 314 L590 314 Z"/>
  </g>
  <!-- Red orthogonal connectors from bulb to modular idea boxes -->
  <g stroke="#CC0000" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M586 322 L586 365 L310 365 L310 405"/>
    <path d="M435 365 L435 405"/>
    <path d="M600 322 L600 405"/>
    <path d="M614 322 L614 365 L890 365 L890 405"/>
    <path d="M765 365 L765 405"/>
  </g>
  <!-- Animated signal pulses along connectors -->
  <g class="connector-signal" stroke="#CC0000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M586 322 L586 365 L310 365 L310 405"/>
    <path d="M435 365 L435 405"/>
    <path d="M600 322 L600 405"/>
    <path d="M614 322 L614 365 L890 365 L890 405"/>
    <path d="M765 365 L765 405"/>
  </g>
  <!-- Connection nodes -->
  <g class="node-pulse" fill="#CC0000">
    <circle cx="586" cy="365" r="4"/>
    <circle cx="614" cy="365" r="4"/>
    <circle cx="435" cy="365" r="4"/>
    <circle cx="765" cy="365" r="4"/>
    <circle cx="310" cy="405" r="4"/>
    <circle cx="435" cy="405" r="4"/>
    <circle cx="600" cy="405" r="4"/>
    <circle cx="765" cy="405" r="4"/>
    <circle cx="890" cy="405" r="4"/>
  </g>
  <!-- Modular idea boxes (UX, Architecture, Logic, Data, Product) -->
  <g stroke="#1C1C1C" stroke-width="1.8" fill="#FFFFFF">
    <!-- Box 1 -->
    <g class="module-a">
      <rect x="220" y="405" width="160" height="145" rx="8"/>
      <line x1="220" y1="433" x2="380" y2="433"/>
      <circle cx="236" cy="419" r="3" fill="#CC0000" stroke="none"/>
      <rect x="238" y="450" width="124" height="44" rx="4" fill="#F6F6F6" stroke-width="1.2"/>
      <line x1="238" y1="510" x2="335" y2="510" stroke-width="1.4"/>
      <line x1="238" y1="526" x2="310" y2="526" stroke-width="1.4" stroke-opacity="0.5"/>
    </g>
    <!-- Box 2 -->
    <g class="module-b">
      <rect x="405" y="405" width="160" height="145" rx="8"/>
      <line x1="405" y1="433" x2="565" y2="433"/>
      <circle cx="421" cy="419" r="3" fill="#CC0000" stroke="none"/>
      <rect x="423" y="450" width="56" height="44" rx="4" fill="#F6F6F6" stroke-width="1.2"/>
      <rect x="491" y="450" width="56" height="44" rx="4" fill="#F6F6F6" stroke-width="1.2"/>
      <line x1="423" y1="510" x2="540" y2="510" stroke-width="1.4"/>
      <line x1="423" y1="526" x2="495" y2="526" stroke-width="1.4" stroke-opacity="0.5"/>
    </g>
    <!-- Box 3 (Center) -->
    <rect x="585" y="405" width="30" height="145" rx="8" fill="#F6F6F6" stroke="#CC0000" stroke-dasharray="4 4"/>
    <!-- Box 4 -->
    <g class="module-a">
      <rect x="635" y="405" width="160" height="145" rx="8"/>
      <line x1="635" y1="433" x2="795" y2="433"/>
      <circle cx="651" cy="419" r="3" fill="#CC0000" stroke="none"/>
      <circle cx="715" cy="472" r="22" fill="#F6F6F6" stroke-width="1.2"/>
      <line x1="653" y1="510" x2="770" y2="510" stroke-width="1.4"/>
      <line x1="653" y1="526" x2="730" y2="526" stroke-width="1.4" stroke-opacity="0.5"/>
    </g>
    <!-- Box 5 -->
    <g class="module-b">
      <rect x="820" y="405" width="160" height="145" rx="8"/>
      <line x1="820" y1="433" x2="980" y2="433"/>
      <circle cx="836" cy="419" r="3" fill="#CC0000" stroke="none"/>
      <rect x="838" y="450" width="124" height="20" rx="4" fill="#F6F6F6" stroke-width="1.2"/>
      <rect x="838" y="478" width="124" height="20" rx="4" fill="#F6F6F6" stroke-width="1.2"/>
      <line x1="838" y1="514" x2="930" y2="514" stroke-width="1.4"/>
      <line x1="838" y1="528" x2="900" y2="528" stroke-width="1.4" stroke-opacity="0.5"/>
    </g>
  </g>
</svg>
