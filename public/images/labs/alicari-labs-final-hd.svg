<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <radialGradient id="hdGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CC0000" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#CC0000" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#CC0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdGlass" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#E86666" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A61919" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="hdBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C8982"/>
      <stop offset="35%" stop-color="#ECEAE4"/>
      <stop offset="70%" stop-color="#A8A49C"/>
      <stop offset="100%" stop-color="#5A5853"/>
    </linearGradient>
    <pattern id="hdGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E1E1E" stroke-opacity="0.045" stroke-width="0.75"/>
    </pattern>
    <pattern id="hdHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1E1E1E" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#F4F3EE"/>
  <rect width="1280" height="720" fill="url(#hdGrid)"/>

  <!-- Ambient radial glow around lit bulb -->
  <circle cx="395" cy="340" r="215" fill="url(#hdGlow)"/>

  <!-- Crimson red rays around bulb -->
  <g stroke="#CC0000" stroke-linecap="round">
    <line x1="395" y1="98" x2="395" y2="142" stroke-width="2.6"/>
    <line x1="312" y1="120" x2="334" y2="158" stroke-width="2.4"/>
    <line x1="478" y1="120" x2="456" y2="158" stroke-width="2.4"/>
    <line x1="244" y1="176" x2="276" y2="202" stroke-width="2.3"/>
    <line x1="546" y1="176" x2="514" y2="202" stroke-width="2.3"/>
    <line x1="208" y1="256" x2="248" y2="268" stroke-width="2.2"/>
    <line x1="582" y1="256" x2="542" y2="268" stroke-width="2.2"/>
    <line x1="202" y1="346" x2="244" y2="346" stroke-width="2.2"/>
    <line x1="588" y1="346" x2="546" y2="346" stroke-width="2.2"/>
    <line x1="230" y1="428" x2="266" y2="408" stroke-width="2"/>
    <line x1="560" y1="428" x2="524" y2="408" stroke-width="2"/>
  </g>

  <!-- Detailed lit glass bulb -->
  <path d="M395 162 C318 162 264 218 264 290 C264 342 292 377 315 408 C327 424 333 438 335 455 L455 455 C457 438 463 424 475 408 C498 377 526 342 526 290 C526 218 472 162 395 162 Z" fill="url(#hdGlass)" stroke="#1E1E1E" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Specular glass highlights -->
  <path d="M302 232 C292 252 288 274 290 296" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M312 216 C307 223 303 230 300 237" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Glowing red filament & glass stem -->
  <g stroke="#CC0000" stroke-linecap="round" stroke-linejoin="round">
    <line x1="395" y1="455" x2="395" y2="345" stroke="#1E1E1E" stroke-width="1.5" stroke-opacity="0.45"/>
    <path d="M369 453 L369 362 L352 306" stroke-width="2.3"/>
    <path d="M421 453 L421 362 L438 306" stroke-width="2.3"/>
    <path d="M352 306 Q364 286 377 308 Q395 330 413 308 Q426 286 438 306" stroke-width="2.8"/>
    <circle cx="395" cy="306" r="24" fill="#CC0000" fill-opacity="0.12" stroke="none"/>
  </g>

  <!-- Metallic screw base -->
  <g stroke="#1E1E1E" stroke-width="2.1" stroke-linejoin="round">
    <rect x="335" y="455" width="120" height="17" rx="4" fill="url(#hdBase)"/>
    <rect x="339" y="472" width="112" height="16" rx="4" fill="url(#hdBase)"/>
    <rect x="343" y="488" width="104" height="16" rx="4" fill="url(#hdBase)"/>
    <path d="M361 504 L429 504 L416 524 L374 524 Z" fill="#262626"/>
  </g>

  <!-- Desktop Wireframe Monitor -->
