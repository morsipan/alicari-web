    <rect x="631" y="198" width="403" height="242" rx="4" fill="#F8F7F4" stroke-width="1.4"/>
    <path d="M795 456 L870 456 L880 506 L785 506 Z" fill="url(#hdBase)" stroke-width="2"/>
    <line x1="750" y1="506" x2="915" y2="506" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Detailed Desktop Wireframe Layout -->
  <g stroke="#1E1E1E" stroke-opacity="0.6" stroke-width="1.2">
    <line x1="631" y1="220" x2="1034" y2="220"/>
    <circle cx="645" cy="209" r="3.2" fill="#CC0000" stroke="none"/>
    <circle cx="657" cy="209" r="3.2" fill="#1E1E1E" fill-opacity="0.3" stroke="none"/>
    <circle cx="669" cy="209" r="3.2" fill="#1E1E1E" fill-opacity="0.3" stroke="none"/>
    <line x1="664" y1="220" x2="664" y2="440"/>
    <rect x="640" y="236" width="16" height="16" rx="2" fill="#EFECE6"/>
    <rect x="640" y="262" width="16" height="16" rx="2" fill="#EFECE6"/>
    <rect x="640" y="288" width="16" height="16" rx="2" fill="#EFECE6"/>
    <rect x="682" y="254" width="168" height="94" rx="3" fill="url(#hdHatch)"/>
    <line x1="682" y1="254" x2="850" y2="348" stroke-opacity="0.35"/>
    <line x1="850" y1="254" x2="682" y2="348" stroke-opacity="0.35"/>
    <rect x="864" y="254" width="152" height="58" rx="3" fill="#EFECE6"/>
    <line x1="864" y1="326" x2="992" y2="326"/>
    <line x1="864" y1="340" x2="960" y2="340"/>
    <rect x="682" y="362" width="98" height="64" rx="3" fill="#EFECE6"/>
    <rect x="792" y="362" width="98" height="64" rx="3" fill="#EFECE6"/>
    <rect x="902" y="362" width="114" height="64" rx="3" fill="#EFECE6"/>
  </g>

  <!-- Detailed Mobile Wireframe -->
  <g stroke="#1E1E1E" stroke-linejoin="round">
    <rect x="984" y="320" width="128" height="236" rx="18" fill="#FFFFFF" fill-opacity="0.95" stroke-width="2.4"/>
    <rect x="993" y="343" width="110" height="190" rx="6" fill="#F8F7F4" stroke-width="1.3"/>
    <line x1="1035" y1="331" x2="1061" y2="331" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1048" cy="544" r="4" fill="none" stroke-width="1.4"/>
    <rect x="1003" y="355" width="90" height="58" rx="3" fill="url(#hdHatch)" stroke-width="1.1"/>
    <line x1="1003" y1="355" x2="1093" y2="413" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="1093" y1="355" x2="1003" y2="413" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="1003" y1="427" x2="1078" y2="427" stroke-width="1.4"/>
    <line x1="1003" y1="441" x2="1058" y2="441" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="1003" y="457" width="41" height="48" rx="3" fill="#EFECE6" stroke-width="1.1"/>
    <rect x="1052" y="457" width="41" height="48" rx="3" fill="#EFECE6" stroke-width="1.1"/>
  </g>

  <!-- Bottom technical lines, nodes & crimson accents -->
  <g stroke="#1E1E1E" stroke-opacity="0.58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M374 524 L374 580 L470 580"/>
    <path d="M392 524 L392 556 L535 556 L535 614"/>
    <path d="M410 524 L410 536 L650 536 L650 588 L900 588"/>
    <path d="M820 506 L820 550 L970 550"/>
  </g>
  <g stroke="#CC0000" stroke-width="3.8" stroke-linecap="round">
    <line x1="490" y1="556" x2="520" y2="556"/>
    <line x1="770" y1="588" x2="830" y2="588"/>
  </g>
  <g stroke="#1E1E1E" stroke-width="1.4" fill="#F4F3EE">
    <circle cx="470" cy="580" r="4"/>
    <circle cx="535" cy="614" r="4"/>
    <circle cx="900" cy="588" r="4"/>
    <circle cx="970" cy="550" r="4"/>
  </g>
</svg>